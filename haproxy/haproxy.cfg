# Backends are addressed by IP: HAProxy resolves names only at start-up and
# refuses to start if a node is down at that moment.
#
# Route by asking Patroni, not by guessing:
#   GET :8008/primary -> 200 only on the leader
#   GET :8008/replica -> 200 only on a healthy streaming replica
global
    maxconn 300
    log stdout format raw local0

defaults
    mode tcp
    log global
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

# Writes: always the current leader
listen primary
    bind *:5000
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 172.31.250.21:5432 check port 8008
    server pg2 172.31.250.22:5432 check port 8008
    server pg3 172.31.250.23:5432 check port 8008

# Reads: any healthy replica, round robin
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 172.31.250.21:5432 check port 8008
    server pg2 172.31.250.22:5432 check port 8008
    server pg3 172.31.250.23:5432 check port 8008
