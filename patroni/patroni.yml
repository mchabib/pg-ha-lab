# Shared Patroni config. Per-node values come from env vars in
# docker-compose.yml (PATRONI_NAME, *_CONNECT_ADDRESS, passwords).
scope: pg-ha-lab
namespace: /service/

restapi:
  listen: 0.0.0.0:8008

etcd3:
  # overridden by PATRONI_ETCD3_HOSTS
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    # loop_wait + 2 * retry_timeout <= ttl
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    synchronous_mode: true           # one sync standby: no committed write is lost on failover
    postgresql:
      use_pg_rewind: true            # old leader rejoins as replica without a full re-clone
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 256MB
        password_encryption: scram-sha-256
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/patroni/data
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  parameters:
    unix_socket_directories: /var/run/postgresql
  # usernames/passwords from PATRONI_SUPERUSER_*, PATRONI_REPLICATION_*, PATRONI_REWIND_*

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
